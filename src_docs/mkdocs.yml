# this_file: src_docs/mkdocs.yml
site_name: FontLab App
site_description: Shared FontLab domains, UI and Plugmix public contracts.
site_url: https://fontlabcom.github.io/fontlab-fontlabapp/
repo_url: https://github.com/fontlabcom/fontlab-fontlabapp
repo_name: fontlabcom/fontlab-fontlabapp
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Installation: installation.md
  - Domains and shared UI: domains-and-usage.md
  - Plugmix: plugmix.md
  - Development and limits: development-and-limits.md
  - Licence: licence.md
  - Complete maintained references:
      - API map: guides/api-map.md
      - Background tools: guides/background-family.md
      - Runtime reference: guides/runtime-reference.md
extra_css:
  - stylesheets/local.css
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
hooks:
  - english_search.py
